function net(){

 for(let k=n;k<used;k++)nt.writeBuffer(Io,(5-k)*32,I.mantas,(5-k)*8,8)

 if(room)T.textContent=S.filter(x=>x).length+' in '+room},66)
const s=document.createElement('script');s.src='https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';document.head.append(s)

draw();window.__net=()=>({room,me,S});window.__cam=(...a)=>a.forEach((v,i)=>R[i]=v)
}
