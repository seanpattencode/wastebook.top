<p id=s>Keep tabs open.</p>Your code: <b id=code>Creating...</b><br><a id=l style=word-break:break-all></a><p><input id=n aria-label="Device name"><input id=j placeholder="Code or link"><button id=join disabled>Join</button></p><pre id=peers>No devices connected</pre><button id=cam>Camera</button><button onclick=file.click()>File</button><input id=file type=file accept=image/* hidden><video id=v autoplay playsinline hidden style=max-width:100%></video><canvas id=x hidden></canvas><img id=i style=max-width:100%>
<script src=https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js></script><script>
let F,t;const C=new Map,p=new Peer('pcx-'+crypto.randomUUID().slice(0,6).toUpperCase());n.value=navigator.platform;
const list=()=>peers.textContent=[...C.values()].join('\n')||'No devices connected';
function show(d){t=performance.now();URL.revokeObjectURL(i.src);i.src=URL.createObjectURL(new Blob([d]))}
function go(d){if(d){F=d;show(d);for(const c of C.keys())c.send(d)}}
function wire(c){c.on('open',()=>{C.set(c,c.peer);list();c.send(n.value);if(F)c.send(F)});c.on('data',d=>{if(typeof d=='string'){C.set(c,d+' '+c.peer.slice(-6));list()}else show(d)});c.on('close',()=>{C.delete(c);list()});c.on('iceStateChanged',s=>s=='disconnected'&&c.close())}
p.on('error',e=>s.textContent=e);p.on('connection',wire);p.on('open',id=>{code.textContent=id.slice(4);l.href=location.pathname+'#'+code.textContent;l.textContent=l.href;join.disabled=false;if(location.hash){j.value=location.hash;join.click()}});
join.onclick=()=>wire(p.connect('pcx-'+j.value.split('#').pop().trim().toUpperCase()));file.onchange=()=>go(file.files[0]);i.onload=()=>s.textContent='Display '+(performance.now()-t).toFixed(1)+' ms';
cam.onclick=async()=>{cam.disabled=true;try{if(v.srcObject){x.width=v.videoWidth;x.height=v.videoHeight;x.getContext('2d').drawImage(v,0,0);x.toBlob(go,'image/jpeg');v.srcObject.getTracks().forEach(t=>t.stop());v.srcObject=null;v.hidden=true;cam.textContent='Camera'}else{v.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.hidden=false;await v.play();cam.textContent='Take photo'}}catch(e){s.textContent=e}cam.disabled=false}
</script>
